[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaab-runs"
version = "0.1.0"
description = "Compute NCAA men's basketball momentum run metrics."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ncaab = "main:main"
ncaab-runs = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["config", "src"]
